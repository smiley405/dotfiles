# yazi -> neovim, via bin/yazi-wez (reverse direction: nvim/lua/config/yazi.lua).
# <C-o>/<C-t> are unbound by default, so nothing native is shadowed.
#
# %s is yazi's own substitution for the selection (the hovered file if none),
# already shell-quoted and identical everywhere. The `"$@"` this used to pass
# stopped being filled in at 26.x, silently killing both keys on every platform.
#
# Started from nvim, yazi-wez reuses that nvim. On windows the bare name finds
# bin/yazi-wez.cmd.

[[mgr.prepend_keymap]]
on = "<C-o>"
run = 'shell -- yazi-wez edit %s'
desc = "Open in nvim (wezterm split)"

[[mgr.prepend_keymap]]
on = "<C-t>"
run = 'shell -- yazi-wez edit --tab %s'
desc = "Open in nvim (new wezterm tab)"

# Paste into yazi's cwd from anywhere: yazi's y/p use its own register, not the
# system clipboard, so hand the directory to the file manager and let it paste.
# bin/reveal picks one per platform; windows finds bin/reveal.cmd. <C-e> is only
# bound in input mode by default.

[[mgr.prepend_keymap]]
on = "<C-e>"
run = 'shell -- reveal'
desc = "Open cwd in the system file manager"
