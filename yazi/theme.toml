# tokyonight_night -- the palette nvim, wezterm and lazygit already run, so all
# four agree inside one window. Tokens are the scheme's own except the borders,
# which use a lightened terminal_black: #414868 is 1.91:1 on the background,
# under the 3:1 WCAG asks of a meaningful non-text boundary.

[mgr]
cwd = { fg = "#7dcfff" }

find_keyword = { fg = "#e0af68", bold = true, italic = true, underline = true }
find_position = { fg = "#bb9af7", bg = "reset", bold = true, italic = true }

marker_copied = { fg = "#9ece6a", bg = "#9ece6a" }
marker_cut = { fg = "#f7768e", bg = "#f7768e" }
marker_marked = { fg = "#7dcfff", bg = "#7dcfff" }
marker_selected = { fg = "#e0af68", bg = "#e0af68" }

count_copied = { fg = "#1a1b26", bg = "#9ece6a" }
count_cut = { fg = "#1a1b26", bg = "#f7768e" }
count_selected = { fg = "#1a1b26", bg = "#e0af68" }

border_symbol = "│"
border_style = { fg = "#616a90" }

[tabs]
active = { fg = "#1a1b26", bg = "#7aa2f7", bold = true }
inactive = { fg = "#a9b1d6", bg = "#292e42" }

# The mode badge is the one place colour alone carries meaning, so the three
# modes differ in hue and in word, never in shade only.
[mode]
normal_main = { fg = "#1a1b26", bg = "#7aa2f7", bold = true }
normal_alt = { fg = "#7aa2f7", bg = "#292e42" }
select_main = { fg = "#1a1b26", bg = "#9ece6a", bold = true }
select_alt = { fg = "#9ece6a", bg = "#292e42" }
unset_main = { fg = "#1a1b26", bg = "#bb9af7", bold = true }
unset_alt = { fg = "#bb9af7", bg = "#292e42" }

[status]
overall = { fg = "#a9b1d6", bg = "#16161e" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }

perm_type = { fg = "#7aa2f7" }
perm_read = { fg = "#e0af68" }
perm_write = { fg = "#f7768e" }
perm_exec = { fg = "#9ece6a" }
perm_sep = { fg = "#7982ab" }

progress_label = { fg = "#c0caf5", bold = true }
progress_normal = { fg = "#7aa2f7", bg = "#292e42" }
progress_error = { fg = "#f7768e", bg = "#292e42" }

[input]
border = { fg = "#7aa2f7" }
title = {}
value = {}
selected = { reversed = true }

[pick]
border = { fg = "#7aa2f7" }
active = { fg = "#bb9af7", bold = true }
inactive = {}

[cmp]
border = { fg = "#7aa2f7" }
active = { fg = "#bb9af7", bold = true }
inactive = {}

[tasks]
border = { fg = "#7aa2f7" }
title = {}
hovered = { fg = "#bb9af7", underline = true }

[which]
cols = 3
mask = { bg = "#292e42" }
cand = { fg = "#7dcfff" }
rest = { fg = "#7982ab" }
desc = { fg = "#bb9af7" }
separator = "  "
separator_style = { fg = "#616a90" }

[confirm]
border = { fg = "#7aa2f7" }
title = { fg = "#7aa2f7" }
body = {}
list = { fg = "#7dcfff" }
btn_yes = { reversed = true }
btn_no = {}

[notify]
title_info = { fg = "#9ece6a" }
title_warn = { fg = "#e0af68" }
title_error = { fg = "#f7768e" }

[help]
on = { fg = "#7dcfff" }
run = { fg = "#bb9af7" }
desc = { fg = "#a9b1d6" }
hovered = { reversed = true, bold = true }
footer = { fg = "#16161e", bg = "#c0caf5" }
