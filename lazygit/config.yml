customCommands:
  # lazygit has <ctrl+t> everywhere but here. -d compares the whole tree,
  # and kdiff3 writes straight to your files -- --no-symlinks to be asked.
  - key: '<c-t>'
    context: 'commits'
    description: 'kdiff3 folder diff vs this commit'
    command: 'command -v kdiff3 >/dev/null && { setsid nohup git difftool -d --no-prompt {{.SelectedCommit.Hash}} >/dev/null 2>&1 & } || echo "kdiff3 is not installed"'
    output: 'log'

  # The shifted twin of <ctrl+t>: one file there, everything here.
  # Untracked files are missing -- git diff does not see them.
  - key: 'T'
    context: 'files'
    description: 'kdiff3 folder diff of all current changes'
    command: 'command -v kdiff3 >/dev/null && { setsid nohup git difftool -d --no-prompt HEAD >/dev/null 2>&1 & } || echo "kdiff3 is not installed"'
    output: 'log'
